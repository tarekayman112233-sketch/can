<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canva Website iframe Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#site{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;border:0;background:#fff}
#intro{position:fixed;inset:0;z-index:10;background:#111;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#open{font-family:Georgia,"Times New Roman",serif;color:#fff;font-size:18px;letter-spacing:1px;cursor:pointer;background:transparent;border:1px solid #fff;border-radius:50px;padding:12px 24px}
#musicBtn{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.75);background:rgba(0,0,0,.45);color:#fff;font-size:19px;display:none}
</style>
</head>
<body>

<iframe
  id="site"
  src="https://tdesignation1.my.canva.site/dahwojn0kh4"
  title="Canva Website"
  allowfullscreen
  allow="fullscreen">
</iframe>

<div id="intro">
  <button id="open" type="button">افتح الدعوة</button>
</div>

<audio id="music" loop preload="auto" src="music.mp3"></audio>
<button id="musicBtn" type="button">♫</button>

<script>
const intro=document.getElementById('intro');
const openBtn=document.getElementById('open');
const music=document.getElementById('music');
const musicBtn=document.getElementById('musicBtn');

openBtn.addEventListener('click', async ()=>{
  music.volume=.7;
  try{ await music.play(); }catch(e){ console.log(e); }
  intro.classList.add('hide');
  musicBtn.style.display='block';
  setTimeout(()=>intro.style.display='none',800);
});

musicBtn.addEventListener('click', async ()=>{
  if(music.paused){
    try{ await music.play(); }catch(e){}
  } else {
    music.pause();
  }
  musicBtn.textContent=music.paused?'♪':'♫';
});
</script>
</body>
</html>

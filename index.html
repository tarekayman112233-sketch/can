<title>Canva Embed Test</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
}
body {
  overflow-x: hidden;
}
.canva-wrap {
  position: relative;
  width: 100%;
  height: 0;
  padding-top: 450.2928%;

  margin: 0;

  box-shadow: none;

}
.canva-wrap iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  border: 0;
  padding: 0;
  margin: 0;
  display: block;
}
</style>
</head>
<body>
<div class="canva-wrap">

    loading="eager"

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canva Official Embed Test 3</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #fff;
  overflow-x: hidden;
}

/*
  نفس النسبة الأصلية التي أعطاها Canva:
  padding-top: 450.2928%

  التعديلات الوحيدة:
  - إزالة الـ shadow
  - إزالة الـ margins
  - إزالة border-radius
  - لا يوجد zoom/scale من عندنا
*/

.canva-embed {
  position: relative;
  width: 100%;
  height: 0;
  padding-top: 450.2928%;
  padding-bottom: 0;

  margin: 0;
  overflow: hidden;

  border-radius: 0;
  box-shadow: none;

  will-change: transform;
}

.canva-embed iframe {
  position: absolute;

  width: 100%;
  height: 100%;

  top: 0;
  left: 0;

  border: none;
  padding: 0;
  margin: 0;

  display: block;
}
</style>
</head>

<body>

<div class="canva-embed">

  <iframe
    loading="lazy"
    src="https://www.canva.com/design/DAHWNlbzp4U/8Zk0tWuGA-t7qech8OnX6g/view?embed"
    allowfullscreen="allowfullscreen"
    allow="fullscreen"
    title="حفل زفاف خالد وياسمين">
  </iframe>

</div>

</body>
</html>

<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canva Quality Test 2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;overflow-x:hidden}
#stage{
  position:relative;
  width:100vw;
  height:calc(100vw * 4.502928);
  overflow:hidden;
  background:#fff;
}
#canva{
  position:absolute;
  inset:0;
  width:200%;
  height:200%;
  border:0;
  display:block;
  transform:scale(.5);
  transform-origin:top left;
}
</style>
</head>
<body>
<div id="stage">
  <iframe
    id="canva"
    loading="eager"
    src="https://www.canva.com/design/DAHWNlbzp4U/8Zk0tWuGA-t7qech8OnX6g/view?embed"
    allowfullscreen
    allow="fullscreen"
    title="Canva high-resolution test">
  </iframe>
</div>
</body>
</html>
